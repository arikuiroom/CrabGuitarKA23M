<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}iframe{display:block;width:390px;height:844px;border:0}button{min-height:44px}</style><button id="run">Run arm tests</button><button id="hold">Hold arm bend</button><button id="release">Release arm</button><pre id="result">Ready</pre><iframe id="app" src="../../dist/index.html"></iframe><script type="module">
const wait=()=>new Promise(r=>setTimeout(r,30));let w,d,svg,scene;const init=()=>{w=app.contentWindow;d=w.document;svg=d.querySelector('#instrument');scene=d.querySelector('.scene');svg.setPointerCapture=()=>{};d.querySelector('#stringboard').setPointerCapture=()=>{}};const xy=(x,y)=>{let p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(d.querySelector('#actualStrings').getScreenCTM())};const pos=(v,t=.5)=>xy(635+887*t+11.4*v,684-370*t+19.6*v);const ev=(target,type,id,p={x:0,y:0})=>target.dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:p.x,clientY:p.y,bubbles:true,button:0}));hold.onclick=()=>{init();ev(svg,'pointerdown',90,xy(974,857));ev(svg,'pointermove',90,xy(974,950))};release.onclick=()=>{init();ev(svg,'pointerup',90,xy(974,950))};run.onclick=async()=>{try{init();const script=d.createElement('script');script.type='module';script.textContent=`import{GuitarAudio}from'./audio.js?v=23';window.armCalls=[];for(const name of ['pluck','pluckHarmonic','cutStrum','setBend','stopAll']){const old=GuitarAudio.prototype[name];GuitarAudio.prototype[name]=function(...a){window.armCalls.push([name,...a]);return old.apply(this,a)}}`;d.body.append(script);await wait();const assert=(ok,m)=>{if(!ok)throw Error(m)},notes=()=>w.armCalls.filter(a=>a[0]==='pluck'||a[0]==='pluckHarmonic'||a[0]==='cutStrum').length;
ev(svg,'pointerdown',1,pos(2));ev(svg,'pointerup',1,pos(2));await wait();const prior=notes(),stops=w.armCalls.filter(a=>a[0]==='stopAll').length;ev(svg,'pointerdown',2,pos(2,.92));ev(svg,'pointerdown',3,xy(974,857));ev(svg,'pointermove',3,xy(974,917));assert(+scene.dataset.bend>1.9,'arm direction or range');ev(svg,'pointerup',2,pos(2,.92));for(let id=4;id<=6;id++){ev(svg,'pointerdown',id,pos(0));ev(svg,'pointermove',id,pos(5));ev(svg,'pointerup',id,pos(5))}const br=d.querySelector('#stringboard').getBoundingClientRect(),bp={x:br.left+br.width*.5,y:br.top+br.height*.5};ev(d.querySelector('#stringboard'),'pointerdown',8,bp);ev(d.querySelector('#stringboard'),'pointerup',8,bp);await wait();assert(notes()===prior,'new note during arm hold');assert(w.armCalls.filter(a=>a[0]==='stopAll').length===stops,'arm cut ringing notes');ev(svg,'pointermove',3,xy(974,700));assert(+scene.dataset.bend===-4,'negative clamp');ev(w,'pointermove',3,{x:-60,y:1200});assert(Math.abs(+scene.dataset.bend)===4,'window outside tracking');ev(svg,'pointercancel',3,xy(974,700));assert(+scene.dataset.bend===0,'cancel must return');ev(svg,'pointerdown',10,pos(2));ev(svg,'pointerup',10,pos(2));await wait();assert(notes()===prior+1,'fresh gesture after release');ev(svg,'pointerdown',11,xy(390,420));assert(scene.dataset.damped==='true','new mute zone');assert(w.getComputedStyle(d.querySelector('#palmHint')).display==='none'&&w.getComputedStyle(d.querySelector('#palmLabel')).display==='none','mute guide hidden while held');ev(svg,'pointerup',11,xy(390,420));ev(svg,'pointerdown',12,pos(2));ev(svg,'pointerup',12,pos(2));await wait();assert(notes()===prior+2,'mute release replay');ev(svg,'pointerdown',30,xy(974,857));ev(svg,'pointermove',30,xy(974,920));w.dispatchEvent(new w.Event('blur'));assert(+scene.dataset.bend===0,'blur reset');result.textContent=JSON.stringify({passed:true,blurRestores:true,pendingHarmonicCancelled:true,directAndPanelSuppressed:true,ringingUninterrupted:true,bendRange:'±4 semitones',cancelRestores:true,muteRelocated:true,syntheticCaptureStub:true},null,2)}catch(e){result.textContent=String(e.stack||e)}};
</script>
