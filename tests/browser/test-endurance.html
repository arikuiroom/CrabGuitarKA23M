<!doctype html><meta charset="utf-8"><button id="run">Run 180 second endurance</button><pre id="result">Ready</pre><iframe id="app" src="../../dist/index.html?v=14" style="width:390px;height:844px;border:0"></iframe><script type="module">
const sleep=ms=>new Promise(r=>setTimeout(r,ms));run.onclick=async()=>{run.disabled=true;const records=[];try{const w=app.contentWindow,d=w.document,svg=d.querySelector('#instrument');svg.setPointerCapture=()=>{};const s=d.createElement('script');s.type='module';s.textContent=`import{GuitarAudio}from'./audio.js?v=23';window.stats={created:0,ended:0,active:0,peak:0,calls:0,times:[],reads:0};const unlock=GuitarAudio.prototype.unlock;GuitarAudio.prototype.unlock=function(...args){window.audioProbe=this;return unlock.apply(this,args)};const pluck=GuitarAudio.prototype.pluck;GuitarAudio.prototype.pluck=function(...args){let t=performance.now();const r=pluck.apply(this,args);window.stats.calls++;window.stats.times.push(performance.now()-t);return r};const meter=GuitarAudio.prototype.readOutputLevel;GuitarAudio.prototype.readOutputLevel=function(...args){window.stats.reads++;return meter.apply(this,args)};const create=AudioContext.prototype.createBufferSource;AudioContext.prototype.createBufferSource=function(...args){const n=create.apply(this,args);window.stats.created++;window.stats.active++;window.stats.peak=Math.max(window.stats.peak,window.stats.active);n.addEventListener('ended',()=>{window.stats.ended++;window.stats.active--},{once:true});return n};`;d.body.append(s);await sleep(80);const pos=v=>{let p=svg.createSVGPoint();p.x=635+887*.4+11.4*v;p.y=684-370*.4+19.6*v;return p.matrixTransform(d.querySelector('#actualStrings').getScreenCTM())},ev=(type,id,v)=>{const p=pos(v);svg.dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:p.x,clientY:p.y,bubbles:true,button:0}))};let frames=[],last=0,raf;const frame=now=>{if(last)frames.push(now-last);last=now;raf=w.requestAnimationFrame(frame)};raf=w.requestAnimationFrame(frame);const quant=(a,q)=>a.length?[...a].sort((a,b)=>a-b)[Math.min(a.length-1,Math.floor(a.length*q))]:0;const snap=label=>{const a=w.audioProbe,t=w.stats;records.push({label,created:t.created,ended:t.ended,active:t.active,peak:t.peak,voices:a?.voices.length,live:a?.liveVoices.size,cache:a?.cache.size,heap:w.performance.memory?.usedJSHeapSize,dom:d.querySelectorAll('*').length,animations:d.getAnimations().length,calls:t.calls,pluckP50:quant(t.times,.5),pluckP95:quant(t.times,.95),frameP95:quant(frames,.95),meterReads:t.reads});t.times=[];frames=[];result.textContent=JSON.stringify({running:true,records},null,2)};
const colors=['red','mint','black','darkbrown','redbrown'];let count=0;const begin=performance.now();while(performance.now()-begin<180000){if(count%100===0){d.querySelector('button[data-preset="'+colors[Math.floor(count/100)%5]+'"]').click();await sleep(100)}ev('pointerdown',1,0);ev('pointermove',1,5);ev('pointerup',1,5);if(count%15===0){d.querySelector('[data-chord="'+(['open','C','G','Am','Em'][Math.floor(count/15)%5])+'"]').dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:2,bubbles:true,button:0}))}if(count%25===24)snap('stroke '+(count+1));count++;await sleep(100)}snap('playing end');d.querySelector('#stop').click();await sleep(5000);snap('quiet drain');const before=w.stats.reads;await sleep(3000);snap('idle 3s');w.cancelAnimationFrame(raf);const final=records.at(-1);result.textContent=JSON.stringify({passed:final.active===0&&final.live===0&&final.voices===0&&final.cache<=48&&w.stats.reads===before,strokeCount:count,idleMeterReads:w.stats.reads-before,records},null,2)}catch(e){result.textContent=JSON.stringify({error:String(e.stack||e),records})}run.disabled=false};
</script>
