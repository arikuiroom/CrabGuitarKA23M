<!doctype html><meta charset="utf-8"><style>body{margin:0}#result{max-height:60px;overflow:auto}iframe{display:block}</style><button id="run">Run viewport tests</button><button id="portrait">Portrait preview</button><button id="landscape">Landscape preview</button><pre id="result">Ready</pre><iframe id="app" src="../../dist/index.html?v=12" style="width:390px;height:844px;border:0"></iframe><script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));portrait.onclick=()=>{app.style.width='390px';app.style.height='844px'};landscape.onclick=()=>{app.style.width='844px';app.style.height='390px'};run.onclick=async()=>{const rows=[];try{for(const [width,height] of [[390,844],[320,568],[400,700],[844,390],[568,320],[1280,900]]){app.style.width=width+'px';app.style.height=height+'px';await sleep(80);const w=app.contentWindow,d=w.document,selectors=['#instrument','button[data-preset="red"]','button[data-preset="redbrown"]','[data-chord="open"]','[data-chord="Em"]','#mute','#volume','#stop'];let boxes=selectors.map(s=>{const e=d.querySelector(s),r=e.getBoundingClientRect();return{s,x:r.x,y:r.y,w:r.width,h:r.height,shown:w.getComputedStyle(e).display!=='none',fits:r.x>=-.5&&r.y>=-.5&&r.right<=width+.5&&r.bottom<=height+.5}});w.scrollTo(0,200);await sleep(30);const compact=width<=780||height<=740;rows.push({width,height,compact,scroll:w.scrollY,docWidth:d.documentElement.scrollWidth,boxes});if(compact&&(w.scrollY!==0||boxes.some(b=>!b.fits)))throw Error('viewport failure '+width+'x'+height);}result.textContent=JSON.stringify({passed:true,rows},null,2)}catch(e){result.textContent=JSON.stringify({passed:false,error:String(e),rows},null,2)}};
</script>
