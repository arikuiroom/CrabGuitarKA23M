<!doctype html><meta charset="utf-8"><button id="run">Test direct color images</button><pre id="result">Ready</pre><iframe id="app" src="../../dist/index.html" style="width:390px;height:844px"></iframe><script>
run.onclick=async()=>{try{const d=app.contentDocument,out=[],ids=['red','mint','black','darkbrown','redbrown','red'];await new Promise(r=>setTimeout(r,200));for(let n=0;n<10;n++)for(const id of ids){d.querySelector(`[data-preset="${id}"]`).click();const imgs=[...d.querySelectorAll('.painted-sprite')];const ok=imgs.length===6&&imgs.every(i=>i.tagName==='image'&&!i.closest('defs')&&i.getAttribute('href')===`sprites/${id}.png`&&i.getAttributeNS('http://www.w3.org/1999/xlink','href')===`sprites/${id}.png`);if(!ok)throw Error('Visible sprite update failed '+id);if(!n)out.push({id,visibleImages:imgs.length,hrefAndXlink:true});}if(d.querySelector('use[href="#kaniImage"]')||d.querySelector('#paintTint'))throw Error('Old clone or paint filter remains');result.textContent=JSON.stringify({passed:true,switches:60,out},null,2)}catch(e){result.textContent=String(e.stack)}};
</script>
