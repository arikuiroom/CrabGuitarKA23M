<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><button id="run">Run input tests</button><pre id="result">Ready</pre><iframe id="app" src="../../dist/index.html" style="width:390px;height:844px"></iframe><script type="module">
run.onclick=async()=>{try{const w=app.contentWindow,d=w.document;const script=d.createElement('script');script.type='module';script.textContent=`import {GuitarAudio} from './audio.js?v=22';const old=GuitarAudio.prototype.stopAll;window.qaStops=0;GuitarAudio.prototype.stopAll=function(...a){window.qaStops++;return old.apply(this,a)};window.qaReady=true;`;d.body.append(script);await new Promise(r=>setTimeout(r,100));const svg=d.querySelector('#instrument'),scene=d.querySelector('.scene');svg.setPointerCapture=()=>{};const point=(value)=>{const p=svg.createSVGPoint();p.x=635+887*.5+11.4*value;p.y=684-370*.5+19.6*value;return p.matrixTransform(d.querySelector('#actualStrings').getScreenCTM())};let clock=1000;const ev=(target,type,id,p={x:0,y:0})=>{const event=new w.PointerEvent(type,{pointerId:id,pointerType:'touch',isPrimary:id===21,clientX:p.x,clientY:p.y,bubbles:true,button:0});Object.defineProperty(event,'timeStamp',{value:clock+=40});return target.dispatchEvent(event)};const read=()=>+(scene.dataset.plucks||0);const base=read();ev(d.querySelector('[data-chord="C"]'),'pointerdown',11);if(d.querySelector('[data-chord="C"]').getAttribute('aria-pressed')!=='true')throw Error('Chord did not select on down');ev(svg,'pointerdown',21,point(2));await new Promise(r=>setTimeout(r,45));if(Math.abs(+scene.dataset.lastFrequency-164.814)>.01)throw Error('Held C note');ev(d.querySelector('[data-chord="G"]'),'pointerdown',12);ev(svg,'pointermove',21,point(3));await new Promise(r=>setTimeout(r,45));if(Math.abs(+scene.dataset.lastFrequency-195.998)>.01)throw Error('New G note');ev(svg,'pointerup',21,point(3));ev(d.querySelector('[data-chord="C"]'),'pointerup',11);d.querySelector('[data-chord="C"]').dispatchEvent(new w.MouseEvent('click',{bubbles:true,detail:1}));if(d.querySelector('[data-chord="G"]').getAttribute('aria-pressed')!=='true')throw Error('Old chord release replaced new chord');ev(d.querySelector('[data-chord="G"]'),'pointerup',12);if(w.qaStops!==0)throw Error('Chord interrupted audio');ev(d.querySelector('[data-chord="open"]'),'pointerdown',13);let hits=[];for(const [id,v,expected]of [[31,-2.5,true],[32,7.5,true],[33,-3,false],[34,8,false],[35,0,true],[36,5,true]]){let before=read();ev(svg,'pointerdown',id,point(v));ev(svg,'pointerup',id,point(v));let hit=read()>before;if(hit!==expected)throw Error('Hit-band '+v+' '+hit);hits.push({position:v,hit});}let before=read();ev(svg,'pointerdown',41,point(-2.5));for(let v=-2;v<=7.5;v+=.25)ev(svg,'pointermove',41,point(v));ev(svg,'pointerup',41,point(7.5));if(read()-before!==6)throw Error('Six string sweep got '+(read()-before));result.textContent=JSON.stringify({passed:true,chordStops:w.qaStops,multiPointerNotes:2,newHitBand:hits,sweepNotes:read()-before,totalPlucks:read()-base,syntheticPointerCaptureStub:true},null,2)}catch(e){result.textContent=String(e.stack||e)}};
</script>
