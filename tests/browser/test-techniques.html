<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><button id="run">Run gesture tests</button><pre id="result">Ready</pre><iframe id="app" src="../../dist/index.html" style="width:390px;height:844px"></iframe><script type="module">
run.onclick=async()=>{try{const w=app.contentWindow,d=w.document,script=d.createElement('script');script.type='module';script.textContent=`import {GuitarAudio} from './audio.js?v=23';window.qaAudio=[];for(const name of ['pluck','pluckHarmonic','pluckCut','cutStrum','setDamped','stopAll']){const original=GuitarAudio.prototype[name];GuitarAudio.prototype[name]=function(...args){window.qaAudio.push([name,...args]);return original.apply(this,args)}}window.qaReady=true;`;d.body.append(script);await new Promise(r=>setTimeout(r,100));if(!w.qaReady)throw Error('Audio hook missing');const svg=d.querySelector('#instrument'),scene=d.querySelector('.scene');svg.setPointerCapture=()=>{};const xy=(x,y)=>{let p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(d.querySelector('#actualStrings').getScreenCTM())};const pos=(v,t=.92)=>xy(635+887*t+11.4*v,684-370*t+19.6*v);const ev=(target,type,id,p={x:0,y:0})=>target.dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:p.x,clientY:p.y,bubbles:true,button:0}));const wait=()=>new Promise(r=>setTimeout(r,45)),notes=()=>w.qaAudio.flatMap(a=>a[0]==='cutStrum'?a[1].map(f=>['pluckCut',f,a[2]]):a[0].startsWith('pluck')?[a]:[]);const assert=(ok,msg)=>{if(!ok)throw Error(msg)};let before=notes().length;ev(svg,'pointerdown',1,pos(2));await wait();assert(notes().length===before,'green down must stay silent');ev(svg,'pointerup',1,pos(2));await wait();assert(notes().at(-1)[0]==='pluckHarmonic','green tap harmonic');let results={greenTap:notes().at(-1)};before=notes().length;ev(svg,'pointerdown',2,pos(0));for(let v=.25;v<=5;v+=.25)ev(svg,'pointermove',2,pos(v));ev(svg,'pointerup',2,pos(5));await wait();let sweep=notes().slice(before);assert(sweep.length===6&&sweep.every(a=>a[0]!=='pluckHarmonic'),'green swipe exactly six normal notes');results.greenSwipe=sweep.length;before=notes().length;ev(svg,'pointerdown',101,pos(0));ev(svg,'pointerup',101,pos(5));await wait();assert(notes().slice(before).length===6&&notes().slice(before).every(a=>a[0]==='pluck'),'fast interior release-only swipe');results.fastSwipe=6;before=notes().length;ev(svg,'pointerdown',3,pos(2));ev(svg,'pointercancel',3,pos(2));await wait();assert(notes().length===before,'cancelled tap made a note');before=notes().length;ev(svg,'pointerdown',4,pos(2,.5));await wait();assert(notes().length===before+1&&notes().at(-1)[0]==='pluck','ordinary hold plays after brief classifier');ev(svg,'pointerup',4,pos(2,.5));ev(svg,'pointerdown',5,xy(390,420));assert(scene.dataset.damped==='true','blue hold must damp');before=notes().length;ev(svg,'pointerdown',6,pos(1,.5));ev(svg,'pointerup',6,pos(1,.5));await wait();assert(notes().length===before,'notes blocked while damping');ev(svg,'pointerdown',7,xy(390,420));ev(svg,'pointerup',5,xy(390,420));assert(scene.dataset.damped==='true','second palm finger must keep damping');ev(svg,'pointercancel',7,xy(390,420));assert(scene.dataset.damped==='false','last palm release must restore');ev(svg,'pointerdown',8,pos(1,.5));ev(svg,'pointerup',8,pos(1,.5));await wait();assert(notes().length===before+1,'normal note after release');results.palmHoldRelease=true;
let stopCount=w.qaAudio.filter(a=>a[0]==='stopAll').length;ev(d.querySelector('[data-chord="C"]'),'pointerdown',10);ev(svg,'pointerdown',11,pos(2,.5));ev(d.querySelector('[data-chord="G"]'),'pointerdown',12);ev(svg,'pointermove',11,pos(3,.5));ev(svg,'pointerup',11,pos(3,.5));ev(d.querySelector('[data-chord="C"]'),'pointerup',10);d.querySelector('[data-chord="C"]').dispatchEvent(new w.MouseEvent('click',{detail:1,bubbles:true}));ev(d.querySelector('[data-chord="G"]'),'pointerup',12);await wait();assert(w.qaAudio.filter(a=>a[0]==='stopAll').length===stopCount,'chord switch interrupted sound');assert(d.querySelector('[data-chord="G"]').getAttribute('aria-pressed')==='true','old release reset chord');results.heldChords=true;ev(d.querySelector('[data-chord="open"]'),'pointerdown',13);
for(let j=0;j<10;j++){ev(svg,'pointerdown',20+j,pos(2));ev(svg,'pointerup',20+j,pos(2));}await wait();assert(notes().slice(-10).every(a=>a[0]==='pluckHarmonic'),'rapid taps misclassified');results.rapidTaps=10;before=notes().length;ev(svg,'pointerdown',40,pos(2));ev(svg,'pointerdown',41,xy(390,420));ev(svg,'pointerup',41,xy(390,420));ev(svg,'pointerup',40,pos(2));await wait();assert(notes().length===before,'palm must cancel deferred tap');results.deferredTapCancelled=true;let presetBefore=notes().length;d.querySelector('[data-preset="mint"]').click();await wait();assert(notes().length===presetBefore&&scene.dataset.preset==='mint','preset accidental strum');results.passed=true;results.syntheticCaptureStub=true;result.textContent=JSON.stringify(results,null,2)}catch(e){result.textContent=String(e.stack||e)}};
</script>
