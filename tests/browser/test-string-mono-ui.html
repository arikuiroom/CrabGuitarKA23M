<!doctype html><meta charset="utf-8"><button id="run">Test normal strums and single-string voices</button><pre id="result">Ready</pre><iframe id="app" src="../../dist/index.html" style="width:390px;height:844px;border:0"></iframe><script type="module">
const sleep=ms=>new Promise(r=>setTimeout(r,ms));run.onclick=async()=>{const checks=[];try{const w=app.contentWindow,d=w.document,svg=d.querySelector('#instrument');svg.setPointerCapture=()=>{};const script=d.createElement('script');script.type='module';script.textContent=`import{GuitarAudio}from'./audio.js?v=23';window.monoCalls=[];for(const method of ['pluck','pluckHarmonic','cutStrum','pluckCut','stopAll']){const old=GuitarAudio.prototype[method];GuitarAudio.prototype[method]=function(...args){window.monoAudio=this;window.monoCalls.push({method,args});return old.apply(this,args)}}`;d.body.append(script);await sleep(80);const assert=(ok,msg)=>{if(!ok)throw Error(msg);checks.push(msg)},xy=(x,y)=>{const p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(d.querySelector('#actualStrings').getScreenCTM())},pos=(v,t=.3)=>xy(635+887*t+11.4*v,684-370*t+19.6*v);let id=1;const ev=(type,p,target=svg,pid=id)=>target.dispatchEvent(new w.PointerEvent(type,{pointerId:pid,pointerType:'touch',clientX:p.x,clientY:p.y,bubbles:true,button:0})),tap=(v,t=.3)=>{id++;ev('pointerdown',pos(v,t));ev('pointerup',pos(v,t))};tap(0);await sleep(100);const audio=w.monoAudio;w.monoCalls=[];
for(const [width,height] of [[390,844],[320,568],[844,390]]){app.style.width=width+'px';app.style.height=height+'px';await sleep(50);d.querySelector('#stop').click();await sleep(100);w.monoCalls=[];id++;ev('pointerdown',pos(0));for(const v of [5,0,5,0])ev('pointermove',pos(v));ev('pointerup',pos(0));assert(!w.monoCalls.some(c=>c.method==='cutStrum'||c.method==='pluckCut'),'Fast held reversals never cut '+width);assert(audio.voices.length===6&&new Set(audio.voices.map(v=>v.stringIndex)).size===6,'Only one active voice per six strings '+width);await sleep(90);assert(audio.liveVoices.size<=6,'Released duplicates fully end '+width)}
app.style.width='390px';app.style.height='844px';await sleep(40);d.querySelector('#stop').click();await sleep(110);tap(2);tap(4);await sleep(60);const old=audio.voices.find(v=>v.stringIndex===2),other=audio.voices.find(v=>v.stringIndex===4);tap(2,.9);const next=audio.voices.find(v=>v.stringIndex===2);assert(next!==old&&next.harmonic,'Harmonic replaces same physical string immediately');assert(audio.voices.includes(other),'Other string remains active');await sleep(90);assert(!audio.liveVoices.has(old),'Old same-string source ended after fade');assert(audio.liveVoices.has(other),'Other string continues after replacement');const beforePreset=[...audio.voices];w.monoCalls=[];d.querySelector('[data-preset="mint"]').click();assert(!w.monoCalls.some(c=>c.method==='stopAll'),'Color selection does not stop voices');assert(beforePreset.every(v=>audio.liveVoices.has(v)),'Color selection preserves ringing sources');tap(2);await sleep(90);assert(!audio.liveVoices.has(next)&&audio.liveVoices.has(other),'Same index replaces across preset and technique changes');
const beforeChord=[...audio.voices];ev('pointerdown',{x:0,y:0},d.querySelector('[data-chord="G"]'),500);assert(beforeChord.every(v=>audio.liveVoices.has(v)),'Chord selection preserves ringing sources');
app.style.width='1280px';app.style.height='900px';await sleep(50);const board=d.querySelector('#stringboard');board.setPointerCapture=()=>{};const rect=board.getBoundingClientRect(),bp={x:rect.left+5+(rect.width-10)*(2.5/6),y:rect.top+rect.height*.5};const beforePanel=audio.voices.find(v=>v.stringIndex===2);ev('pointerdown',bp,board,600);ev('pointerup',bp,board,600);await sleep(90);assert(!audio.liveVoices.has(beforePanel)&&audio.voices.some(v=>v.stringIndex===2),'Assist panel shares direct string identity');assert(!w.monoCalls.some(c=>c.method==='cutStrum'||c.method==='pluckCut'),'No cutting API calls from any gesture');d.querySelector('#stop').click();await sleep(130);result.textContent=JSON.stringify({passed:true,checks,active:audio.voices.length,live:audio.liveVoices.size},null,2)}catch(e){result.textContent=JSON.stringify({passed:false,checks,error:String(e.stack)},null,2)}};
</script>
